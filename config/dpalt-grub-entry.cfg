
# DP alt mode: the 7.1 GPU + USB4 kernel with the fairydust DP-alt tipd hack and a DTB
# that routes the external DCP to the front port's Type-C PHY (no DP-IN route).
menuentry 'Omarchy - Asahi 7.1 DP alt mode (manual)' --id 'omarchy-dpalt' {
    load_video
    set gfxpayload=keep
    insmod gzio
    insmod part_gpt
    insmod btrfs
    search --no-floppy --fs-uuid --set=root 725346d2-f127-47bc-b464-9dd46155e8d6
    linux /@/boot/vmlinuz-usb4-gpu-test root=UUID=725346d2-f127-47bc-b464-9dd46155e8d6 rw rootflags=subvol=@ loglevel=7
    initrd /@/boot/initramfs-dpalt.img
}
