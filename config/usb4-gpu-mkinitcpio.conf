# Use the installed policy without changing it. Explicit -c prevents mkinitcpio
# from loading drop-ins automatically, so source them here in their usual order.
source /etc/mkinitcpio.conf
for _usb4_config in /etc/mkinitcpio.conf.d/*.conf; do
    [[ ! -f $_usb4_config ]] || source "$_usb4_config"
done
unset _usb4_config
# Include modules even when the currently running 7.2 kernel cannot autodetect
# the stock GPU. The Asahi GPU itself is built into the new kernel.
MODULES+=(btrfs appledrm phy_apple_atc tps6598x_core tps6598x thunderbolt thunderbolt_apple)
